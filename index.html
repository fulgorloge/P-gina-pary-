<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sinister Forest // Underground Techno Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Space+Grotesk:wght@400;600;700&family=UnifrakturMaguntina&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #020203;
      --bg-dark: #050203;
      --card-bg: rgba(12, 12, 15, 0.78);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent: #ff003c;
      --accent-glow: rgba(255, 0, 60, 0.55);
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.5);
      --font: 'Space Grotesk', sans-serif;
      --font-techno: 'Orbitron', sans-serif;
      --font-ui: 'Rajdhani', sans-serif;
      --gold-light: #fff3a8;
      --gold-mid: #d4af37;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 50%, #4a000e 0%, #0a0305 70%),
        radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 60, 0.15) 0%, transparent 40%);
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    #flash-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #ffffff;
      pointer-events: none;
      z-index: 99;
      opacity: 0;
      transition: opacity 0.04s ease-out;
    }

    .grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
      opacity: 0.04;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px var(--accent-glow);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 30px 22px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    body.strobe-active {
      animation: strobe-flash 0.1s infinite steps(1, start);
    }

    @keyframes strobe-flash {
      0% { background-color: #ffffff; color: #000000; }
      50% { background-color: #020203; color: #ffffff; }
      100% { background-color: #ff003c; color: #ffffff; }
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.58rem;
      letter-spacing: 1px;
      color: var(--accent);
      background: rgba(255, 0, 60, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--accent-glow);
      font-weight: 700;
    }

    .blink-dot {
      width: 6px; height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }

    .strobe-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }

    .strobe-btn:hover, .strobe-btn.active {
      background: var(--accent);
      box-shadow: 0 0 15px var(--accent);
      border-color: #ff003c;
      color: #fff;
    }

    h1.glitch {
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      color: #fff;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .subtitle { font-size: 0.65rem; letter-spacing: 3px; color: var(--text-muted); margin-top: 4px; }

    .audio-visualizer {
      display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 24px; margin: 12px 0;
    }

    .audio-visualizer span {
      width: 4px; height: 100%; background: var(--accent); border-radius: 3px;
      transform-origin: bottom; animation: equalizer 1s infinite ease-in-out alternate;
      box-shadow: 0 0 6px var(--accent);
    }

    .audio-visualizer span:nth-child(1) { animation-delay: 0.1s; }
    .audio-visualizer span:nth-child(2) { animation-delay: 0.4s; }
    .audio-visualizer span:nth-child(3) { animation-delay: 0.2s; }
    .audio-visualizer span:nth-child(4) { animation-delay: 0.6s; }
    .audio-visualizer span:nth-child(5) { animation-delay: 0.3s; }
    .audio-visualizer span:nth-child(6) { animation-delay: 0.5s; }
    .audio-visualizer span:nth-child(7) { animation-delay: 0.2s; }
    .audio-visualizer span:nth-child(8) { animation-delay: 0.7s; }
    .audio-visualizer span:nth-child(9) { animation-delay: 0.3s; }

    @keyframes equalizer { 0% { transform: scaleY(0.15); } 100% { transform: scaleY(1); } }

    .lineup-section {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 14px;
      margin-bottom: 15px;
    }

    .lineup-title {
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .dj-card.headliner {
      background: rgba(255, 0, 60, 0.08);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
      box-shadow: 0 0 15px var(--accent-glow);
      transition: transform 0.3s ease;
    }

    .dj-card.headliner:hover { transform: scale(1.02); }

    .dj-tag {
      font-size: 0.55rem;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }

    .dj-name {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .dj-genre {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-top: 2px;
    }

    .dj-socials {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      font-size: 0.6rem;
    }

    .dj-link {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      padding: 4px 12px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .dj-link:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(255, 0, 60, 0.12);
    }

    .capacity-bar { margin-bottom: 15px; }
    .capacity-text { font-size: 0.6rem; letter-spacing: 1px; color: var(--accent); font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .progress-bg { background: rgba(255,255,255,0.08); height: 4px; border-radius: 4px; overflow: hidden; }
    .progress-fill { background: var(--accent); height: 100%; box-shadow: 0 0 8px var(--accent); transition: width 0.4s ease; }

    .spotify-embed-container { margin-bottom: 15px; border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border); background: #000; position: relative; }
    
    .change-song-trigger {
      display: block;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 0.55rem;
      letter-spacing: 1.5px;
      padding: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .change-song-trigger:hover {
      background: rgba(255, 0, 60, 0.15);
      color: #fff;
    }

    .countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
    .time-box { background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.08); padding: 10px 2px; border-radius: 12px; }
    .time-number { display: block; font-size: 1.4rem; font-weight: 700; color: #fff; font-family: var(--font-techno); }
    .time-label { font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; }

    .calendar-btn {
      display: block; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
      color: #fff; text-decoration: none; font-size: 0.65rem; font-weight: 700; letter-spacing: 1px;
      padding: 10px; border-radius: 10px; margin-bottom: 15px; transition: 0.3s; cursor: pointer; text-align: center;
    }
    .calendar-btn:hover { background: rgba(255, 255, 255, 0.15); }

    .contribution-section {
      background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px; padding: 16px 12px; margin-bottom: 15px;
    }
    .contribution-badge { font-size: 0.58rem; letter-spacing: 2px; color: var(--text-muted); }
    .amount-container { display: flex; justify-content: center; align-items: baseline; gap: 4px; margin: 4px 0; }
    .currency { font-size: 1rem; color: var(--accent); font-weight: 700; }
    .amount { font-size: 2rem; font-weight: 900; }
    .unit { font-size: 0.75rem; color: var(--text-muted); }
    .nequi-number { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px; white-space: nowrap; }
    .nequi-number span { color: #fff; font-weight: 700; }
    .btn-group { display: flex; gap: 8px; }
    .contribution-btn {
      flex: 1; background: var(--accent); color: #fff; padding: 10px 6px; border-radius: 8px;
      text-decoration: none; font-weight: 700; font-size: 0.68rem; border: none; cursor: pointer; transition: 0.3s;
    }
    .contribution-btn.secondary { background: rgba(255, 255, 255, 0.1); }
    .contribution-btn:hover { filter: brightness(1.2); }

    .location-box { background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 14px; margin-bottom: 15px; }
    #location-title { font-size: 0.7rem; font-weight: 700; color: var(--accent); }
    #location-details { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }

    .action-dual-btn { display: flex; gap: 8px; margin-bottom: 15px; }
    .rsvp-btn, .ticket-btn {
      flex: 1; background: transparent; border: 1px solid var(--accent); color: var(--accent);
      padding: 10px 4px; border-radius: 8px; font-family: var(--font); font-weight: 700; font-size: 0.65rem; cursor: pointer; transition: 0.3s;
    }
    .rsvp-btn.confirmed { background: var(--accent); color: #fff; }
    .ticket-btn { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }

    .social-share { padding-top: 12px; border-top: 1px solid var(--glass-border); margin-bottom: 12px; }
    .share-title { font-size: 0.58rem; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 8px; }
    .social-btns { display: flex; gap: 6px; justify-content: center; }
    .s-btn { cursor: pointer; padding: 8px 10px; border-radius: 12px; border: none; font-size: 0.65rem; font-weight: 700; font-family: var(--font); color: #fff; }
    .wa { background: #128C7E; } .fb { background: #1877F2; } .copy { background: rgba(255,255,255,0.1); }

    footer { font-size: 0.6rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }

    .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); justify-content: center; align-items: center; overflow-y: auto; padding: 20px;}
    .modal-content { background: #0a0a0c; border: 1px solid var(--accent); border-radius: 20px; padding: 25px; width: 90%; max-width: 620px; text-align: center; position: relative; box-shadow: 0 0 30px var(--accent-glow); }
    .close-modal { position: absolute; right: 15px; top: 10px; font-size: 1.5rem; color: #fff; cursor: pointer; }
    .ticket-badge { font-size: 0.55rem; letter-spacing: 2px; color: var(--accent); margin-bottom: 5px; font-weight: 700; }
    .ticket-input { width: 100%; padding: 10px 14px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--accent); border-radius: 8px; color: #fff; font-family: var(--font); font-size: 0.8rem; text-align: center; outline: none; margin-bottom: 12px; }
    
    /* CHAT GLOBAL STYLES */
    .global-chat-box { display: flex; flex-direction: column; height: 360px; text-align: left; }
    .chat-messages-container { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .chat-msg { font-size: 0.72rem; line-height: 1.3; color: #e0e0e0; background: rgba(255,255,255,0.04); padding: 8px 10px; border-radius: 8px; word-break: break-word; }
    .chat-user { font-weight: 700; color: var(--accent); margin-right: 6px; font-family: var(--font-techno); font-size: 0.65rem; }
    .chat-time { font-size: 0.55rem; color: var(--text-muted); float: right; }
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input { flex: 1; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; color: #fff; font-family: var(--font); font-size: 0.75rem; outline: none; }
    .chat-send-btn { background: var(--accent); color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-family: var(--font); font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
    .chat-send-btn:hover { filter: brightness(1.2); }

    /* Estilos del Ticket */
    .ticket-wrapper {
      position: relative; width: 100%; max-width: 580px; perspective: 1200px;
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.25)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
      margin: 15px auto;
    }
    .flip-card-inner { position: relative; width: 100%; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .ticket-wrapper.flipped .flip-card-inner { transform: rotateY(180deg); }
    .ticket-frame { padding: 2px; background: var(--gold-gradient); border-radius: 16px; position: relative; backface-visibility: hidden; }
    .ticket-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(145deg, #0d0003 0%, #1a0006 50%, #050203 100%); border-radius: 16px; padding: 2px; transform: rotateY(180deg); backface-visibility: hidden; z-index: 5; }
    .ticket-back-content { width: 100%; height: 100%; background: #0d0003; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
    .back-title { font-family: var(--font-techno); font-size: 0.85rem; letter-spacing: 2px; color: var(--gold-light); text-transform: uppercase; border-bottom: 1px solid rgba(212, 175, 55, 0.4); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .back-rules { list-style: none; font-size: 0.75rem; color: rgba(255, 255, 255, 0.85); margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .back-rules li::before { content: "• "; color: var(--gold-mid); }
    .map-box { border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 6px; background: rgba(255, 0, 60, 0.05); padding: 10px; text-align: center; font-family: var(--font-techno); font-size: 0.65rem; letter-spacing: 1px; color: var(--gold-light); }
    .flip-trigger-btn { position: absolute; top: 10px; right: 10px; z-index: 25; background: rgba(0, 0, 0, 0.7); border: 1px solid var(--gold-mid); color: var(--gold-light); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; transition: transform 0.3s; }
    .ticket { position: relative; display: flex; flex-direction: column; background: linear-gradient(145deg, #120004 0%, #2a000a 50%, #0d0003 100%); border-radius: 14px; box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.95); overflow: hidden; }
    .hologram-watermark-pattern { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; transform: rotate(-25deg); font-family: var(--font-techno); font-size: 0.65rem; font-weight: 800; letter-spacing: 3px; line-height: 1.8; pointer-events: none; z-index: 3; opacity: 0.18; word-break: break-all; background: linear-gradient(var(--holo-angle, 45deg), #ff007f 0%, #7f00ff 33%, #00f3ff 66%, #ff007f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; mix-blend-mode: screen; }
    .star-flare { position: absolute; width: 22px; height: 22px; background: radial-gradient(circle, #ffffff 15%, rgba(255, 243, 168, 0.9) 35%, transparent 70%); clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%); z-index: 20; pointer-events: none; }
    .flare-1 { top: -8px; left: -8px; } .flare-2 { top: -8px; right: -8px; } .flare-3 { bottom: -8px; left: -8px; } .flare-4 { bottom: -8px; right: -8px; }
    .notch { position: absolute; width: 22px; height: 22px; background-color: var(--bg-dark); border-radius: 50%; z-index: 10; border: 2px solid #d4af37; box-shadow: inset 0 0 6px rgba(0,0,0,0.9); }
    .notch-left { left: -11px; top: calc(100% - 73px - 11px); } .notch-right { right: -11px; top: calc(100% - 73px - 11px); }
    .main-section { padding: 24px 18px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; z-index: 4; }
    .stub-section { height: 73px; padding: 12px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(0, 0, 0, 0.4); text-align: center; position: relative; z-index: 4; }
    .stub-border-interactive { position: absolute; left: 0; right: 0; top: calc(100% - 73px - 20px); height: 40px; z-index: 30; cursor: ns-resize; display: flex; align-items: center; justify-content: center; touch-action: none; }
    .stub-border-line { width: 100%; height: 2px; border-top: 2px dashed rgba(212, 175, 55, 0.85); position: relative; }
    .cut-progress { position: absolute; left: 0; top: -2px; height: 6px; background: linear-gradient(90deg, #ff003c 0%, #ff8000 50%, #fff3a8 100%); width: 0%; border-radius: 4px; transition: width 0.02s linear, height 0.02s linear; }
    .blade-indicator { position: absolute; width: 24px; height: 24px; background: #ffffff; border-radius: 50%; transform: translate(-50%, -50%) scale(0); pointer-events: none; z-index: 40; transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .stub-border-interactive.cutting .blade-indicator { transform: translate(-50%, -50%) scale(1); }
