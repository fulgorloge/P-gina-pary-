<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sinister Forest // Techno Night</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="container">
    <header>
      <h1>THE SINISTER FOREST</h1>
      <p class="subtitle">LA EXPERIENCIA TECHNO // MUSICA TECHNO ONLY</p>
    </header>
    
    <section class="artist-section">
      <h2>DJ TUCNAK</h2>
    </section>

    <section class="spotify-section">
      <iframe src="https://open.spotify.com/embed/track/65ox9ejkqSzkoBrAZ7DG2U?theme=0" width="100%" height="152" frameBorder="0" allow="encrypted-media"></iframe>
    </section>

    <section id="countdown" class="countdown-grid">
      <div class="time-box"><span id="days" class="time-number">00</span><span class="time-label">Días</span></div>
      <div class="time-box"><span id="hours" class="time-number">00</span><span class="time-label">Hrs</span></div>
      <div class="time-box"><span id="minutes" class="time-number">00</span><span class="time-label">Min</span></div>
      <div class="time-box"><span id="seconds" class="time-number">00</span><span class="time-label">Seg</span></div>
    </section>

    <section class="contribution-section">
      <div class="contribution-badge">APORTE SUGERIDO</div>
      <p class="contribution-amount">$10.000 <span>COP</span></p>
      <a href="https://nequi.com" target="_blank" class="contribution-btn">PAGAR APORTE ONLINE</a>
    </section>

    <section id="location-card" class="location-box">
      <p id="location-title">UBICACIÓN AÚN NO REVELADA</p>
      <p id="location-details">Coordenadas solo por invitación</p>
      <a id="location-map" class="map-button" href="#" target="_blank">VER EN GOOGLE MAPS</a>
    </section>

    <!-- Barra Social -->
    <section class="social-share">
      <p class="share-title">INVITA A TU CÍRCULO</p>
      <div class="social-btns">
        <button onclick="share('whatsapp')" class="s-btn wa">WhatsApp</button>
        <button onclick="share('facebook')" class="s-btn fb">Facebook</button>
        <button onclick="copyLink()" class="s-btn copy">Copiar Link</button>
      </div>
    </section>

    <footer>
      <div class="views-counter"><span class="views-icon">👁</span> <span id="views-count">0000</span></div>
      <p class="footer-info">MARTES 11 AGO — 23:00H | 18+ ID REQ</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
