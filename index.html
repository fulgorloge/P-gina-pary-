<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Meta tags para redes sociales -->
  <meta property="og:title" content="The Sinister Forest // Techno Night" />
  <meta property="og:description" content="La experiencia sonora clandestina. Solo technófilos." />
  <meta property="og:type" content="website" />
  
  <title>The Sinister Forest // Techno Night</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Overlay de ruido (Textura) -->
  <div class="grain"></div>

  <main class="container">
    <header class="fade-in">
      <h1 class="glitch" data-text="THE SINISTER FOREST">THE SINISTER FOREST</h1>
      <p class="subtitle">LA EXPERIENCIA TECHNO // MUSICA TECHNO ONLY</p>
    </header>
    
    <section class="spotify-section fade-in">
      <iframe src="https://open.spotify.com/embed/track/65ox9ejkqSzkoBrAZ7DG2U?theme=0" width="100%" height="80" frameBorder="0" allow="encrypted-media"></iframe>
    </section>

    <section id="countdown" class="countdown-grid fade-in">
      <div class="time-box"><span id="days" class="time-number">00</span><span class="time-label">Días</span></div>
      <div class="time-box"><span id="hours" class="time-number">00</span><span class="time-label">Hrs</span></div>
      <div class="time-box"><span id="minutes" class="time-number">00</span><span class="time-label">Min</span></div>
      <div class="time-box"><span id="seconds" class="time-number">00</span><span class="time-label">Seg</span></div>
    </section>

    <section class="contribution-section fade-in">
      <div class="contribution-badge">APORTE SUGERIDO</div>
      <div class="amount-container">
        <span class="currency">$</span><span class="amount">10.000</span><span class="unit">COP</span>
      </div>
      <a href="https://nequi.com" target="_blank" class="contribution-btn">PAGAR APORTE</a>
    </section>

    <section id="location-card" class="location-box fade-in">
      <p id="location-title">UBICACIÓN OCULTA</p>
      <p id="location-details">Coordenadas desbloqueables al finalizar el conteo</p>
      <a id="location-map" class="map-button" href="#" target="_blank">VER EN MAPS</a>
    </section>

    <section class="social-share fade-in">
      <p class="share-title">INVITA A TU CÍRCULO</p>
      <div class="social-btns">
        <button onclick="share('whatsapp')" class="s-btn wa">WhatsApp</button>
        <button onclick="share('facebook')" class="s-btn fb">Facebook</button>
        <button onclick="copyLink()" class="s-btn copy">Copiar Link</button>
      </div>
    </section>

    <footer class="fade-in">
      <div class="views-counter"><span id="views-count">0000</span> conexiones activas</div>
      <p class="footer-info">11 AGO — 23:00H | 18+ ID REQ</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
