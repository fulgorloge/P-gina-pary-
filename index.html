<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sinister Forest - Techno Night</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="container">
    <header>
      <h1>The Sinister Forest</h1>
      <p class="subtitle">La Experiencia Techno // Musica Techno Only</p>
    </header>
    
    <section class="artist-section">
      <h2>DJ TUCNAK</h2>
    </section>

    <!-- Reproductor de Spotify -->
    <section class="spotify-section">
      <iframe 
        style="border-radius:12px" 
        src="https://open.spotify.com/embed/track/65ox9ejkqSzkoBrAZ7DG2U?utm_source=generator&theme=0" 
        width="100%" 
        height="152" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>
    </section>

    <!-- Cuenta regresiva hasta el lunes -->
    <section id="countdown" class="countdown-grid" aria-live="polite">
      <div class="time-box">
        <span id="days" class="time-number">00</span>
        <span class="time-label">Días</span>
      </div>
      <div class="time-box">
        <span id="hours" class="time-number">00</span>
        <span class="time-label">Horas</span>
      </div>
      <div class="time-box">
        <span id="minutes" class="time-number">00</span>
        <span class="time-label">Min</span>
      </div>
      <div class="time-box">
        <span id="seconds" class="time-number">00</span>
        <span class="time-label">Seg</span>
      </div>
    </section>

    <!-- Bloque dinámico de ubicación -->
    <section id="location-card" class="location-box">
      <p id="location-title" class="location-title">UBICACIÓN AÚN NO REVELADA</p>
      <p id="location-details" class="location-details">
        Coordenadas solo por invitación
      </p>
      <a id="location-map" class="map-button" href="#" target="_blank" rel="noopener noreferrer">
        VER EN GOOGLE MAPS
      </a>
    </section>

    <footer>
      <p class="footer-info">MARTES 11 AGO — 23:00H - LATE | 18+ ID REQ</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
