<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Pass // The Sinister Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Usamos 'Poppins' para una jerarquía clara y 'Orbitron' para toques futuristas/tech -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    /* -----------------------------------------------------------
       1. VARIABLES Y RESET
       ----------------------------------------------------------- */
    :root {
      /* Paleta de colores */
      --bg-dark: #08080a; /* Fondo ultra oscuro */
      --card-base: #1a1a1d; /* Base de la tarjeta */
      --metal-crimson: #5c0010; /* Rojo metalizado oscuro */
      --metal-bright: #9e001c; /* Rojo metalizado brillante */
      --cyan-neon: #00ffff; /* Cian neón para la calavera/QR */
      --cyan-glow: rgba(0, 255, 255, 0.5);
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --gold-accent: #c5a059; /* Dorado sutil para emblemas */
      
      /* Fuentes */
      --font-primary: 'Poppins', sans-serif;
      --font-tech: 'Orbitron', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      /* Textura de fondo sutil */
      background-image: 
        radial-gradient(circle at 50% -20%, #2a0008 0%, transparent 40%),
        repeating-linear-gradient(45deg, #0a0a0c 0px, #0a0a0c 1px, transparent 1px, transparent 10px);
      font-family: var(--font-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* -----------------------------------------------------------
       2. CONTENEDOR PRINCIPAL Y PERSPECTIVA 3D
       ----------------------------------------------------------- */
    .scene {
      perspective: 1500px; /* Necesario para el efecto 3D */
    }

    .ticket-container {
      width: 100%;
      max-width: 480px; /* Ancho similar a la imagen */
      position: relative;
      transform-style: preserve-3d;
      transform: rotateY(-10deg) rotateX(5deg); /* Rotación inicial */
      transition: transform 0.6s ease-out;
      filter: drop-shadow(0 30px 60px rgba(0,0,0,0.8));
    }
    
    /* Efecto hover suave para interactuar */
    .ticket-container:hover {
      transform: rotateY(0deg) rotateX(0deg);
    }

    /* -----------------------------------------------------------
       3. ESTRUCTURA DE LA TARJETA (Metal y Marco)
       ----------------------------------------------------------- */
    .premium-pass {
      background: var(--card-base);
      border-radius: 20px;
      padding: 5px; /* Espacio para el marco exterior */
      position: relative;
      overflow: hidden;
      
      /* Marco de metal biselado 3D */
      box-shadow: 
        inset 0 0 15px rgba(0,0,0,0.5), /* Sombra interna */
        0 2px 0 #333, 0 4px 0 #222, 0 6px 1px rgba(0,0,0,0.4); /* Grosor del borde 3D */
    }
    
    /* Marco metálico exterior biselado */
    .premium-pass::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 20px;
      border: 4px solid #3a3a3d; /* Color metal frío */
      border-top-color: #555; /* Brillo superior */
      border-bottom-color: #111; /* Sombra inferior */
      pointer-events: none;
      z-index: 10;
    }

    /* -----------------------------------------------------------
       4. FONDO ROJO METALIZADO CON RELIEVE DE BOSQUE
       ----------------------------------------------------------- */
    .inner-content {
      background: var(--metal-crimson);
      /* Degradado complejo para simular metal cepillado rojo */
      background-image: 
        linear-gradient(160deg, var(--metal-bright) 0%, var(--metal-crimson) 40%, #2a0005 100%),
        /* Textura de ruido metálico (usando un gradiente repetitivo muy fino) */
        repeating-radial-gradient(circle at center, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px);
      border-radius: 16px;
      padding: 30px 25px;
      position: relative;
      z-index: 1;
    }
    
    /* Textura de ramas de bosque oscuro (Relieve sutil en el fondo) */
    .inner-content::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M10 10 C 20 40, 40 20, 50 50 M60 10 C 70 30, 80 10, 90 40 M10 60 C 30 70, 20 90, 50 80 M70 60 C 80 80, 90 70, 90 90" stroke="%23300008" stroke-width="1.5" fill="none" opacity="0.4"/%3E%3C/svg%3E');
      background-size: 150px;
      opacity: 0.6;
      pointer-events: none;
    }

    /* -----------------------------------------------------------
       5. CABECERA Y BADGE
       ----------------------------------------------------------- */
    header {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }

    .main-title {
      font-family: var(--font-tech);
      font-weight: 900;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #fff;
      /* Efecto de texto grabado sutil */
      text-shadow: 0 2px 4px rgba(0,0,0,0.5), 0 0 1px rgba(255,255,255,0.3);
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, #3a3a3d, #1a1a1d);
      padding: 6px 16px;
      border-radius: 50px;
      border: 1px solid #444;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .status-icon {
      width: 10px; height: 10px;
      background-color: var(--cyan-neon);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan-neon), 0 0 20px var(--cyan-neon);
      animation: pulseGlow 2s infinite;
    }
    
    .status-text {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #fff;
    }

    /* -----------------------------------------------------------
       6. SECCIÓN CENTRAL: CALAVERA HOLOGRÁFICA Y DATOS
       ----------------------------------------------------------- */
    .hero-section {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }

    /* Contenedor de la Calavera con Efecto Neón Cian */
    .skull-container {
      width: 100px; height: 100px;
      background: radial-gradient(circle at center, #102a2a 0%, #08080a 70%);
      border-radius: 12px;
      border: 2px solid #222;
      display: flex; justify-content: center; align-items: center;
      position: relative;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.8);
    }
    
    /* Brillo Neón Cian detrás de la calavera */
    .skull-container::before {
      content: '';
      position: absolute;
      width: 60px; height: 60px;
      background-color: var(--cyan-neon);
      border-radius: 50%;
      filter: blur(25px);
      opacity: 0.7;
    }

    /* Calavera SVG estilizada en Cian */
    .skull-icon {
      width: 70px; height: 70px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 5px var(--cyan-neon));
    }

    .user-data {
      flex: 1;
    }

    .data-group {
      margin-bottom: 12px;
    }

    .label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 400;
      margin-bottom: 2px;
    }

    .value-primary {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }
    
    .value-secondary {
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--text-main);
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* -----------------------------------------------------------
       7. CÓDIGO QR ESTILIZADO
       ----------------------------------------------------------- */
    .qr-section {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
    }

    .qr-container {
      display: inline-block;
      background-color: #000;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #222;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.8);
      position: relative;
    }
    
    /* Efecto de escaneo neón cian sobre el QR */
    .qr-container::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, var(--cyan-neon), transparent);
      box-shadow: 0 0 10px var(--cyan-neon);
      animation: scanQR 3s infinite linear;
      opacity: 0.8;
    }

    /* Generamos un QR falso visual usando degradados */
    .qr-code-placeholder {
      width: 140px; height: 140px;
      background-image: 
        /* Tres cuadrados de esquina típicos */
        linear-gradient(90deg, var(--cyan-neon) 20px, transparent 20px, transparent 120px, var(--cyan-neon) 120px),
        linear-gradient(0deg, var(--cyan-neon) 20px, transparent 20px, transparent 120px, var(--cyan-neon) 120px),
        /* Patrón de datos aleatorio sutil en cian */
        repeating-linear-gradient(45deg, transparent 0px, transparent 2px, rgba(0, 255, 255, 0.3) 2px, rgba(0, 255, 255, 0.3) 4px),
        repeating-linear-gradient(-45deg, transparent 0px, transparent 2px, rgba(0, 255, 255, 0.3) 2px, rgba(0, 255, 255, 0.3) 4px);
      background-size: 140px 140px, 140px 140px, 8px 8px, 8px 8px;
      background-position: center;
      filter: drop-shadow(0 0 2px var(--cyan-glow));
    }

    /* -----------------------------------------------------------
       8. PANELES VIP (ZONA Y MESA)
       ----------------------------------------------------------- */
    .vip-panels-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      position: relative;
      z-index: 2;
    }

    /* Estilo de panel empotrado/tallado (efecto 3D inverso) */
    .vip-panel {
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,0.05);
      /* Sombra interna para efecto 'carved' (tallado) */
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 5px;
    }

    .panel-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(-- gold-accent); /* Color dorado sutil */
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Icono de emblema dorado tallado */
    .emblem-icon {
      width: 14px; height: 14px;
      background: var(--gold-accent);
      border-radius: 3px;
      box-shadow: 0 0 5px rgba(197, 160, 89, 0.5);
    }

    .panel-value {
      font-family: var(--font-tech);
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    
    .panel-sub {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* -----------------------------------------------------------
       9. FOOTER: FECHA Y CONDICIONES
       ----------------------------------------------------------- */
    footer {
      margin-top: 30px;
      text-align: center;
      position: relative;
      z-index: 2;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 20px;
    }

    .event-details {
      font-family: var(--font-tech);
      font-size: 0.9rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .terms-notice {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* -----------------------------------------------------------
       10. ANIMACIONES
       ----------------------------------------------------------- */
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--cyan-neon); }
      50% { opacity: 0.6; box-shadow: 0 0 5px var(--cyan-neon); }
    }
    
    @keyframes scanQR {
      0% { top: 0; }
      50% { top: 100%; transform: translateY(-4px); }
      100% { top: 0; }
    }

    /* -----------------------------------------------------------
       11. MEDIA QUERIES (RESPONSIVE)
       ----------------------------------------------------------- */
    @media (max-width: 400px) {
      .hero-section { flex-direction: column; text-align: center; gap: 10px; }
      .main-title { font-size: 1.5rem; }
      .vip-panels-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Escena 3D para la perspectiva -->
  <div class="scene">
    
    <!-- Contenedor de la tarjeta con rotación -->
    <div class="ticket-container" id="ticket">
      <div class="premium-pass">
        <div class="inner-content">
          
          <!-- Cabecera -->
          <header>
            <h1 class="main-title">The Sinister Forest</h1>
            <div class="status-badge">
              <span class="status-icon"></span>
              <span class="status-text">Official Verified Pass</span>
            </div>
          </header>

          <!-- Sección Central -->
          <div class="hero-section">
            <div class="skull-container">
              <!-- Calavera SVG estilizada cian -->
              <svg class="skull-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10 C 30 10, 15 25, 15 45 C 15 60, 25 75, 35 80 L 35 90 L 65 90 L 65 80 C 75 75, 85 60, 85 45 C 85 25, 70 10, 50 10 Z M35 40 A 10 10 0 1 1 35 41 Z M65 40 A 10 10 0 1 1 65 41 Z M50 65 Q 50 75, 40 75 Q 50 75, 60 75 Q 50 75, 50 65 Z" fill="none" stroke="#00ffff" stroke-width="4" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="user-data">
              <div class="data-group">
                <div class="label">Pass Holder</div>
                <div class="value-primary">GUEST</div>
              </div>
              <div class="data-group">
                <div class="label">Unique Code</div>
                <span class="value-secondary">TSF-000000</span>
              </div>
            </div>
          </div>

          <!-- Código QR -->
          <div class="qr-section">
            <div class="qr-container">
              <!-- Placeholder visual del código QR -->
              <div class="qr-code-placeholder"></div>
            </div>
          </div>

          <!-- Paneles VIP (GRID) -->
          <div class="vip-panels-container">
            <!-- Zona VIP -->
            <div class="vip-panel">
              <div class="panel-header">
                <span class="panel-title">Zona VIP</span>
                <span class="emblem-icon"></span> <!-- Emblema sutil -->
              </div>
              <div class="panel-value">El Abismo</div>
              <div class="panel-sub">Acceso Exclusivo</div>
            </div>
            <!-- Mesa -->
            <div class="vip-panel">
              <div class="panel-header">
                <span class="panel-title">Mesa</span>
                <span class="emblem-icon"></span> <!-- Emblema sutil -->
              </div>
              <div class="panel-value">Z-13</div>
              <div class="panel-sub">Mesa Reservada</div>
            </div>
          </div>

          <!-- Footer -->
          <footer>
            <div class="event-details">11 AGO // 23:00H | RAW TECHNO</div>
            <div class="terms-notice">Presentar DNI / Cédula original en puerta</div>
          </footer>

        </div> <!-- /inner-content -->
      </div> <!-- /premium-pass -->
    </div> <!-- /ticket-container -->
    
  </div> <!-- /scene -->

  <script>
    /* Pequeño script opcional para que la tarjeta siga ligeramente el movimiento del ratón */
    const ticket = document.getElementById('ticket');
    const constrain = 20; // Grados máximos de rotación

    function transforms(x, y, el) {
      let box = el.getBoundingClientRect();
      let calcX = -(y - box.y - (box.height / 2)) / constrain;
      let calcY = (x - box.x - (box.width / 2)) / constrain;
      
      return `rotateX(${calcX}deg) rotateY(${calcY}deg) `;
    };

    function callback(e, el) {
      el.style.transform = transforms(e.clientX, e.clientY, el);
    };

    // Solo activamos el efecto si no es un dispositivo táctil
    if (window.matchMedia("(pointer: fine)").matches) {
      document.body.addEventListener('mousemove', (e) => {
        // callback(e, ticket); // Descomenta esta línea para activar el efecto de seguimiento del ratón
      });
    }
  </script>
</body>
</html>
