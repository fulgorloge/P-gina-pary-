<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Pass // The Sinister Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=UnifrakturMaguntina&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050203;
      --gold-light: #fff3a8;
      --gold-mid: #d4af37;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --font-techno: 'Orbitron', sans-serif;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, #4a000e 0%, #0a0305 70%),
        radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 60, 0.15) 0%, transparent 40%);
      font-family: var(--font-ui);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    #particles-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #flash-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(255, 243, 168, 0.8) 0%, rgba(255, 0, 60, 0.4) 50%, transparent 100%);
      pointer-events: none;
      z-index: 99;
      opacity: 0;
      transition: opacity 0.1s ease-out;
    }

    .instructions {
      position: relative;
      z-index: 10;
      font-family: var(--font-techno);
      font-size: 0.65rem;
      color: var(--gold-light);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
      animation: pulseText 1.5s infinite alternate ease-in-out;
    }

    @keyframes pulseText {
      from { opacity: 0.5; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    /* Contenedor Adaptable */
    .ticket-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      perspective: 1200px;
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.25)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
    }

    .ticket-frame {
      padding: 2px;
      background: var(--gold-gradient);
      border-radius: 16px;
      position: relative;
    }

    .ticket {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #120004 0%, #2a000a 50%, #0d0003 100%);
      border-radius: 14px;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.95);
      transform-style: preserve-3d;
    }

    .ticket::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255, 0, 60, 0.2) 1px, transparent 0);
      background-size: 10px 10px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* Destellos de Esquina */
    .star-flare {
      position: absolute;
      width: 22px; height: 22px;
      background: radial-gradient(circle, #ffffff 15%, rgba(255, 243, 168, 0.9) 35%, transparent 70%);
      clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
      z-index: 20;
      pointer-events: none;
      animation: flarePulse 2s infinite alternate ease-in-out;
    }

    .flare-1 { top: -8px; left: -8px; }
    .flare-2 { top: -8px; right: -8px; }
    .flare-3 { bottom: -8px; left: -8px; }
    .flare-4 { bottom: -8px; right: -8px; }

    @keyframes flarePulse {
      0% { transform: scale(0.5); opacity: 0.3; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    /* Muescas circulares laterales alineadas a la línea */
    .notch {
      position: absolute;
      width: 22px; height: 22px;
      background-color: var(--bg-dark);
      border-radius: 50%;
      z-index: 10;
      border: 2px solid #d4af37;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.9);
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    /* Posición exacta de las muescas en móvil (coincide con la junta) */
    .notch-left { left: -11px; top: calc(100% - 73px - 11px); }
    .notch-right { right: -11px; top: calc(100% - 73px - 11px); }

    /* SECCIONES DEL TICKET */
    .main-section {
      padding: 24px 18px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease;
      transform-origin: top center;
    }

    .stub-section {
      height: 73px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      text-align: center;
      position: relative;
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1s ease, filter 1s ease;
      transform-origin: bottom center;
    }

    /* LÍNEA INTERACTIVA DE CORTE UBICADA EXACTAMENTE EN LA JUNTA DE LAS DOS SECCIONES */
    .stub-border-interactive {
      position: absolute;
      left: 12px; right: 12px;
      top: calc(100% - 73px - 14px);
      height: 28px;
      z-index: 30;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .stub-border-line {
      width: 100%;
      height: 2px;
      border-top: 2px dashed rgba(212, 175, 55, 0.85);
      position: relative;
    }

    .cut-progress {
      position: absolute;
      left: 0; top: -2px;
      height: 6px;
      background: linear-gradient(90deg, #ff003c 0%, #ff8000 50%, #fff3a8 100%);
      box-shadow: 0 0 15px #ff003c, 0 0 25px #ff8000;
      width: 0%;
      border-radius: 4px;
      transition: width 0.02s linear;
    }

    .blade-indicator {
      position: absolute;
      width: 20px; height: 20px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #ff003c, 0 0 30px #ffffff, 0 0 45px #ff8000;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 40;
      transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .stub-border-interactive.cutting .blade-indicator {
      transform: translate(-50%, -50%) scale(1);
    }

    /* ANIMACIONES DE TORSIÓN Y RASGADO */
    .ticket.bending .main-section { transform: rotateX(10deg) translateY(-4px) scale(0.995); }
    .ticket.bending .stub-section { transform: rotateX(-14deg) translateY(6px) scale(0.995); }

    .ticket.torn .main-section {
      transform: translateY(-25px) translateZ(30px) rotate(-2deg);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.95);
      clip-path: polygon(
        0% 0%, 100% 0%, 100% calc(100% - 6px),
        95% 100%, 90% calc(100% - 6px), 85% 100%, 80% calc(100% - 6px), 75% 100%, 70% calc(100% - 6px),
        65% 100%, 60% calc(100% - 6px), 55% 100%, 50% calc(100% - 6px), 45% 100%, 40% calc(100% - 6px),
        35% 100%, 30% calc(100% - 6px), 25% 100%, 20% calc(100% - 6px), 15% 100%, 10% calc(100% - 6px),
        5% 100%, 0% calc(100% - 6px)
      );
    }

    .ticket.torn .stub-section {
      transform: translateY(220px) rotate(25deg) translateZ(-80px);
      opacity: 0;
      filter: blur(6px);
      pointer-events: none;
      clip-path: polygon(
        0% 6px, 5% 0%, 10% 6px, 15% 0%, 20% 6px, 25% 0%, 30% 6px, 35% 0%, 40% 6px, 45% 0%, 50% 6px,
        55% 0%, 60% 6px, 65% 0%, 70% 6px, 75% 0%, 80% 6px, 85% 0%, 90% 6px, 95% 0%, 100% 6px,
        100% 100%, 0% 100%
      );
    }

    .ticket.torn .stub-border-interactive,
    .ticket.torn .notch {
      opacity: 0;
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #d4af37;
      padding: 3px 10px;
      border-radius: 4px;
      font-family: var(--font-techno);
      font-size: 0.5rem;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.75);
      margin-bottom: 12px;
    }

    .badge-icon {
      width: 6px; height: 6px;
      background: #ff003c;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff003c;
    }

    .main-header {
      font-family: var(--font-techno);
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .event-title {
      font-family: 'UnifrakturMaguntina', cursive;
      font-size: 2.3rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 0, 60, 0.9), 0 0 20px rgba(255, 0, 60, 0.5);
      line-height: 1;
      margin: 4px 0;
    }

    .sub-header {
      font-family: var(--font-techno);
      font-size: 0.62rem;
      letter-spacing: 3px;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .date-info {
      font-family: var(--font-techno);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
      margin-bottom: 16px;
      border-top: 1px solid rgba(212, 175, 55, 0.5);
      border-bottom: 1px solid rgba(212, 175, 55, 0.5);
      padding: 6px 14px;
      background: rgba(212, 175, 55, 0.08);
      width: 100%;
    }

    .meta-grid {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .meta-box {
      flex: 1;
      max-width: 170px;
      border: 1px solid rgba(212, 175, 55, 0.6);
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
    }

    .meta-label {
      font-family: var(--font-techno);
      font-size: 0.45rem;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .meta-value {
      font-family: var(--font-techno);
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .stub-vertical-text {
      font-family: var(--font-techno);
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .stub-footer {
      font-family: var(--font-techno);
      font-size: 0.52rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 1.2px;
    }

    /* ADAPTACIÓN ESCRITORIO (DISEÑO HORIZONTAL) */
    @media (min-width: 580px) {
      .ticket { flex-direction: row; }
      .main-section { flex: 1; padding: 20px; }
      
      .stub-section {
        width: 155px;
        height: auto;
        padding: 20px 10px;
        justify-content: space-between;
        border-left: 1px solid rgba(212, 175, 55, 0.2);
      }

      .stub-vertical-text {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 0.55rem;
      }

      /* Alineación de la línea interactiva en la junta vertical de escritorio */
      .stub-border-interactive {
        left: auto;
        right: calc(155px - 14px);
        top: 12px; bottom: 12px;
        width: 28px; height: auto;
        cursor: ew-resize;
      }

      .stub-border-line {
        width: 2px; height: 100%;
        border-top: none;
        border-left: 2px dashed rgba(212, 175, 55, 0.85);
      }

      .cut-progress {
        width: 6px; height: 0%;
        left: -2px; top: 0;
        background: linear-gradient(180deg, #ff003c 0%, #ff8000 50%, #fff3a8 100%);
      }

      .badge { position: absolute; top: 12px; left: 15px; margin-bottom: 0; }
      .main-header { margin-top: 10px; }
      .date-info { width: auto; }

      .notch-left, .notch-right { display: none; }
      .notch-top { display: block; right: calc(155px - 11px); top: -11px; }
      .notch-bottom { display: block; right: calc(155px - 11px); bottom: -11px; top: auto; }

      .ticket.bending .main-section { transform: rotateY(-10deg) translateX(-4px); }
      .ticket.bending .stub-section { transform: rotateY(14deg) translateX(6px); }

      .ticket.torn .main-section {
        transform: translateX(-25px) translateZ(30px) rotate(-2deg);
        clip-path: polygon(
          0% 0%, 100% 0%, calc(100% - 6px) 5%, 100% 10%, calc(100% - 6px) 15%, 100% 20%,
          calc(100% - 6px) 25%, 100% 30%, calc(100% - 6px) 35%, 100% 40%, calc(100% - 6px) 45%,
          100% 50%, calc(100% - 6px) 55%, 100% 60%, calc(100% - 6px) 65%, 100% 70%,
          calc(100% - 6px) 75%, 100% 80%, calc(100% - 6px) 85%, 100% 90%, calc(100% - 6px) 95%,
          100% 100%, 0% 100%
        );
      }

      .ticket.torn .stub-section {
        transform: translateX(220px) rotate(25deg) translateZ(-80px);
        clip-path: polygon(
          6px 0%, 0% 5%, 6px 10%, 0% 15%, 6px 20%, 0% 25%, 6px 30%, 0% 35%, 6px 40%,
          0% 45%, 6px 50%, 0% 55%, 6px 60%, 0% 65%, 6px 70%, 0% 75%, 6px 80%,
          0% 85%, 6px 90%, 0% 95%, 6px 100%, 100% 100%, 100% 0%
        );
      }
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="instructions" id="instruction-text">✂️ DESLIZA SOBRE LA LÍNEA PARA CORTAR EL TIQUETE ✂️</div>

  <div class="ticket-wrapper">
    <div class="star-flare flare-1"></div>
    <div class="star-flare flare-2"></div>
    <div class="star-flare flare-3"></div>
    <div class="star-flare flare-4"></div>

    <div class="ticket-frame" id="ticket-frame">
      <div class="notch notch-left notch-top"></div>
      <div class="notch notch-right notch-bottom"></div>

      <!-- Línea táctil de recorte exactamente alineada -->
      <div class="stub-border-interactive" id="cut-line">
        <div class="blade-indicator" id="blade-indicator"></div>
        <div class="stub-border-line">
          <div class="cut-progress" id="cut-progress"></div>
        </div>
      </div>

      <div class="ticket" id="ticket">
        <!-- Sección Principal -->
        <div class="main-section">
          <div class="badge">
            <span class="badge-icon"></span> Official Pass
          </div>

          <div class="main-header">VIP Pass</div>
          <div class="event-title">The Sinister Forest</div>
          <div class="sub-header">Event Of The Year</div>

          <div class="date-info">
            11 AGO // 23:00H | RAW TECHNO
          </div>

          <div class="meta-grid">
            <div class="meta-box">
              <div class="meta-label">Pass Holder</div>
              <div class="meta-value" id="display-name">JP</div>
            </div>
            <div class="meta-box">
              <div class="meta-label">Ticket Code</div>
              <div class="meta-value" id="display-code">TSF-448791</div>
            </div>
          </div>
        </div>

        <!-- Talón Inferior -->
        <div class="stub-section">
          <div class="stub-vertical-text">EVENT OF THE YEAR — 11 AGO</div>
          <div class="stub-footer">ADMIT ONE // DNI REQUIRED</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawName = urlParams.get('name') || "JP";
    const rawCode = urlParams.get('code') || "TSF-448791";

    document.getElementById("display-name").innerText = decodeURIComponent(rawName).toUpperCase();
    document.getElementById("display-code").innerText = decodeURIComponent(rawCode).toUpperCase();

    // LÓGICA DE CORTE SOBRE LA LÍNEA EXACTA
    const cutLine = document.getElementById('cut-line');
    const cutProgress = document.getElementById('cut-progress');
    const bladeIndicator = document.getElementById('blade-indicator');
    const ticket = document.getElementById('ticket');
    const instructionText = document.getElementById('instruction-text');
    const flashOverlay = document.getElementById('flash-overlay');

    let isCutting = false;
    let isTorn = false;
    let lastProgress = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playMicroScratchSound(pitch = 1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const bufferSize = audioCtx.sampleRate * 0.04;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.sin(i / 2);
      }
      
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800 * pitch + (Math.random() * 300 - 150);
      filter.Q.value = 4;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playImpactTearSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const bufferSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
      }
      
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3500, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.5);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function handleStart(e) {
      if (isTorn) return;
      isCutting = true;
      ticket.classList.add('bending');
      cutLine.classList.add('cutting');
      updateCut(e);
    }

    function handleMove(e) {
      if (!isCutting || isTorn) return;
      updateCut(e);
    }

    function handleEnd() {
      if (isTorn) return;
      isCutting = false;
      ticket.classList.remove('bending');
      cutLine.classList.remove('cutting');
      cutProgress.style.width = '0%';
      cutProgress.style.height = '0%';
      lastProgress = 0;
    }

    function updateCut(e) {
      const rect = cutLine.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const isHorizontal = window.innerWidth >= 580;

      let pct = 0;
      if (isHorizontal) {
        pct = (clientY - rect.top) / rect.height;
        bladeIndicator.style.left = '50%';
        bladeIndicator.style.top = (pct * 100) + '%';
      } else {
        pct = (clientX - rect.left) / rect.width;
        bladeIndicator.style.top = '50%';
        bladeIndicator.style.left = (pct * 100) + '%';
      }

      pct = Math.max(0, Math.min(1, pct));

      if (isHorizontal) {
        cutProgress.style.height = (pct * 100) + '%';
      } else {
        cutProgress.style.width = (pct * 100) + '%';
      }

      if (Math.abs(pct - lastProgress) > 0.035) {
        playMicroScratchSound(0.9 + pct * 0.5);
        if (navigator.vibrate) navigator.vibrate(10);
        emitFrictionSparks(clientX, clientY);
        lastProgress = pct;
      }

      if (pct >= 0.88) {
        isTorn = true;
        isCutting = false;
        ticket.classList.remove('bending');
        ticket.classList.add('torn');
        cutLine.classList.remove('cutting');

        instructionText.innerText = "✓ ACCESO VALIDADO // TICKET CORTADO";
        instructionText.style.color = "#00ffaa";
        instructionText.style.animation = "none";

        flashOverlay.style.opacity = '1';
        setTimeout(() => flashOverlay.style.opacity = '0', 120);

        playImpactTearSound();
        if (navigator.vibrate) navigator.vibrate([40, 60, 100]);
        emitBurstSparks(clientX, clientY);
      }
    }

    // CANVAS DE CHISPAS
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let sparkParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function emitFrictionSparks(x, y) {
      for (let i = 0; i < 3; i++) {
        sparkParticles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5 - 2,
          size: Math.random() * 2.5 + 1,
          alpha: 1,
          color: Math.random() > 0.3 ? '#fff3a8' : '#ff003c',
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function emitBurstSparks(x, y) {
      for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 2;
        sparkParticles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3.5 + 1.5,
          alpha: 1,
          color: Math.random() > 0.4 ? '#fff3a8' : (Math.random() > 0.5 ? '#ff8000' : '#ff003c'),
          decay: Math.random() * 0.02 + 0.01
        });
      }
    }

    const bgParticles = Array.from({ length: 25 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.3 + 0.1,
      decay: Math.random() * 0.01 + 0.005
    }));

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      bgParticles.forEach(p => {
        p.y -= p.speed;
        p.alpha += p.decay;
        if (p.alpha > 1 || p.alpha < 0) p.decay = -p.decay;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 243, 168, ${Math.max(0, p.alpha)})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#d4af37';
        ctx.fill();
      });

      for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const sp = sparkParticles[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vy += 0.2;
        sp.alpha -= sp.decay;

        if (sp.alpha <= 0) {
          sparkParticles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fillStyle = sp.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = sp.color;
        ctx.globalAlpha = Math.max(0, sp.alpha);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    cutLine.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    cutLine.addEventListener('touchstart', handleStart, { passive: true });
    window.addEventListener('touchmove', handleMove, { passive: true });
    window.addEventListener('touchend', handleEnd);
  </script>
</body>
</html>
