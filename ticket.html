<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Pass // The Sinister Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Cinzel:wght@700;900&family=UnifrakturMaguntina&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #050203;
      --gold-light: #fff3a8;
      --gold-mid: #d4af37;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --font-techno: 'Orbitron', sans-serif;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, #4a000e 0%, #0a0305 70%),
        radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 60, 0.15) 0%, transparent 40%);
      font-family: var(--font-ui);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    #particles-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Contenedor Adaptable */
    .ticket-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.25)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
    }

    /* Estructura Base del Ticket */
    .ticket {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #120004 0%, #2a000a 50%, #0d0003 100%);
      border: 2px solid #d4af37;
      border-image: var(--gold-gradient) 1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.95), 0 0 15px rgba(212, 175, 55, 0.2);
    }

    /* Textura de Fondo */
    .ticket::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255, 0, 60, 0.2) 1px, transparent 0);
      background-size: 10px 10px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* Destello Diagonal Holográfico */
    .ticket::after {
      content: '';
      position: absolute;
      top: -150%; left: -150%;
      width: 400%; height: 400%;
      background: linear-gradient(
        45deg,
        transparent 43%,
        rgba(255, 243, 168, 0.03) 47%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 243, 168, 0.03) 53%,
        transparent 57%
      );
      transform: rotate(25deg);
      pointer-events: none;
      animation: shineSweep 4s infinite ease-in-out;
    }

    @keyframes shineSweep {
      0% { transform: translateY(-100%) rotate(25deg); }
      35%, 100% { transform: translateY(100%) rotate(25deg); }
    }

    /* Destellos de Luz */
    .star-flare {
      position: absolute;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #ffffff 15%, rgba(255, 243, 168, 0.9) 35%, transparent 70%);
      clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
      z-index: 20;
      pointer-events: none;
      animation: flarePulse 2s infinite alternate ease-in-out;
    }

    .flare-1 { top: -8px; left: -8px; animation-delay: 0s; }
    .flare-2 { top: -8px; right: -8px; animation-delay: 0.6s; }
    .flare-3 { bottom: -8px; left: -8px; animation-delay: 1.2s; }
    .flare-4 { bottom: -8px; right: -8px; animation-delay: 0.3s; }

    @keyframes flarePulse {
      0% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
      100% { transform: scale(1.2) rotate(90deg); opacity: 1; filter: drop-shadow(0 0 6px #fff3a8); }
    }

    /* Muescas y Divisores por Defecto (Móvil) */
    .notch {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: var(--bg-dark);
      border-radius: 50%;
      z-index: 10;
      border: 2px solid #d4af37;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.9);
    }

    .notch-left { left: -11px; bottom: 120px; }
    .notch-right { right: -11px; bottom: 120px; }

    .stub-border {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 130px;
      border-top: 1.5px dashed rgba(212, 175, 55, 0.6);
      z-index: 5;
    }

    /* Sección Principal */
    .main-section {
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #d4af37;
      padding: 3px 10px;
      border-radius: 4px;
      font-family: var(--font-techno);
      font-size: 0.5rem;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.75);
      margin-bottom: 12px;
    }

    .badge-icon {
      width: 6px; height: 6px;
      background: #ff003c;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff003c;
    }

    .main-header {
      font-family: var(--font-techno);
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .event-title {
      font-family: 'UnifrakturMaguntina', cursive;
      font-size: 2.3rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 0, 60, 0.9), 0 0 20px rgba(255, 0, 60, 0.5);
      line-height: 1;
      margin: 4px 0;
    }

    .sub-header {
      font-family: var(--font-techno);
      font-size: 0.62rem;
      letter-spacing: 3px;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .date-info {
      font-family: var(--font-techno);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
      margin-bottom: 14px;
      border-top: 1px solid rgba(212, 175, 55, 0.5);
      border-bottom: 1px solid rgba(212, 175, 55, 0.5);
      padding: 5px 14px;
      background: rgba(212, 175, 55, 0.08);
      width: 100%;
    }

    .meta-grid {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .meta-box {
      flex: 1;
      max-width: 160px;
      border: 1px solid rgba(212, 175, 55, 0.6);
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
    }

    .meta-label {
      font-family: var(--font-techno);
      font-size: 0.45rem;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .meta-value {
      font-family: var(--font-techno);
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      word-break: break-all;
    }

    /* Talón (Stub Section) en Móvil */
    .stub-section {
      height: 130px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
    }

    .stub-text-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .stub-vertical-text {
      font-family: var(--font-techno);
      font-size: 0.58rem;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stub-footer {
      font-family: var(--font-techno);
      font-size: 0.48rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 1px;
    }

    .qr-wrapper {
      background: #fff;
      padding: 5px;
      border-radius: 5px;
      border: 1.5px solid #d4af37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    .qr-wrapper canvas, .qr-wrapper img { display: block; }

    /* MEDIA QUERY: Escritorio y Pantallas Medianas (Layout Horizontal) */
    @media (min-width: 580px) {
      .ticket {
        flex-direction: row;
      }

      .main-section {
        flex: 1;
        padding: 20px;
        align-items: center;
      }

      .badge {
        position: absolute;
        top: 12px;
        left: 15px;
        margin-bottom: 0;
      }

      .main-header {
        margin-top: 10px;
      }

      .date-info {
        width: auto;
      }

      .stub-section {
        width: 155px;
        height: auto;
        padding: 14px 10px;
        flex-direction: column;
        justify-content: space-between;
        text-align: center;
        border-left: 1px solid rgba(212, 175, 55, 0.2);
      }

      .stub-text-box {
        align-items: center;
        text-align: center;
      }

      .stub-vertical-text {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 0.52rem;
        margin-bottom: 0;
      }

      .notch-left { display: none; }
      .notch-right { display: none; }

      .notch-top {
        display: block;
        right: 145px;
        top: -11px;
        bottom: auto;
      }

      .notch-bottom {
        display: block;
        right: 145px;
        bottom: -11px;
        top: auto;
      }

      .stub-border {
        left: auto;
        right: 154px;
        top: 10px;
        bottom: 10px;
        border-top: none;
        border-left: 1.5px dashed rgba(212, 175, 55, 0.6);
      }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <div class="ticket-wrapper">
    <div class="star-flare flare-1"></div>
    <div class="star-flare flare-2"></div>
    <div class="star-flare flare-3"></div>
    <div class="star-flare flare-4"></div>

    <div class="notch notch-left notch-top"></div>
    <div class="notch notch-right notch-bottom"></div>
    <div class="stub-border"></div>

    <div class="ticket">
      <!-- Sección Principal -->
      <div class="main-section">
        <div class="badge">
          <span class="badge-icon"></span> Official Pass
        </div>

        <div class="main-header">VIP Pass</div>
        <div class="event-title">The Sinister Forest</div>
        <div class="sub-header">Event Of The Year</div>

        <div class="date-info">
          11 AGO // 23:00H | RAW TECHNO
        </div>

        <div class="meta-grid">
          <div class="meta-box">
            <div class="meta-label">Pass Holder</div>
            <div class="meta-value" id="display-name">GUEST</div>
          </div>
          <div class="meta-box">
            <div class="meta-label">Ticket Code</div>
            <div class="meta-value" id="display-code">TSF-000000</div>
          </div>
        </div>
      </div>

      <!-- Talón (Stub) -->
      <div class="stub-section">
        <div class="stub-text-box">
          <div class="stub-vertical-text">EVENT OF THE YEAR — 11 AGO</div>
        </div>

        <div class="qr-wrapper" id="qrcode"></div>

        <div class="stub-footer">ADMIT ONE // DNI REQUIRED</div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawName = urlParams.get('name') || "GUEST";
    const rawCode = urlParams.get('code') || "TSF-000000";

    const cleanName = decodeURIComponent(rawName).toUpperCase();
    const cleanCode = decodeURIComponent(rawCode).toUpperCase();

    document.getElementById("display-name").innerText = cleanName;
    document.getElementById("display-code").innerText = cleanCode;

    const qrData = `EVENT:TheSinisterForest|PASS:${cleanCode}|HOLDER:${cleanName}`;
    new QRCode(document.getElementById("qrcode"), {
      text: qrData,
      width: 60,
      height: 60,
      colorDark : "#0a0002",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    // Partículas de fondo
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = Array.from({ length: 25 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.3 + 0.1,
      decay: Math.random() * 0.01 + 0.005
    }));

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.y -= p.speed;
        p.alpha += p.decay;

        if (p.alpha > 1 || p.alpha < 0) p.decay = -p.decay;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 243, 168, ${Math.max(0, p.alpha)})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#d4af37';
        ctx.fill();
      });

      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
