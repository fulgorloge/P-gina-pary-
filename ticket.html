<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ULTRA VIP PASS // The Sinister Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Orbitron:wght@700;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020104;
      --red-neon: #ff003c;
      --red-deep: #40000a;
      --cyan-neon: #00f0ff;
      --gold: #d4af37;
      --gold-light: #fff3a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Fondo de partículas */
    #particles-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Escena 3D */
    .scene {
      perspective: 1000px;
      z-index: 10;
      width: 100%;
      max-width: 400px;
    }

    /* Tarjeta Interactiva */
    .ticket-card {
      position: relative;
      width: 100%;
      border-radius: 24px;
      padding: 3px;
      background: linear-gradient(135deg, #ffffff, #555, #111, #ff003c, #ffffff);
      background-size: 300% 300%;
      animation: borderShift 6s ease infinite;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 50px rgba(255, 0, 60, 0.4);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      cursor: pointer;
    }

    @keyframes borderShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Interior Metalizado */
    .inner-card {
      position: relative;
      background: 
        radial-gradient(circle at 50% 20%, rgba(255, 0, 60, 0.3), transparent 70%),
        linear-gradient(160deg, #120105 0%, #3a000a 35%, #80001a 50%, #200005 70%, #050001 100%);
      border-radius: 22px;
      padding: 26px 20px;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    /* Capa Holográfica Reactiva */
    .hologram {
      position: absolute;
      inset: -100%;
      background: linear-gradient(
        115deg,
        transparent 35%,
        rgba(0, 240, 255, 0.3) 45%,
        rgba(255, 0, 60, 0.4) 50%,
        rgba(212, 175, 55, 0.3) 55%,
        transparent 65%
      );
      transform: rotate(20deg);
      pointer-events: none;
      mix-blend-mode: color-dodge;
      transition: opacity 0.3s;
      z-index: 8;
    }

    /* Header */
    .header {
      text-align: center;
      transform: translateZ(30px);
      margin-bottom: 20px;
    }

    .badge-verified {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--cyan-neon);
      padding: 4px 12px;
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      color: var(--cyan-neon);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .pulse {
      width: 6px; height: 6px;
      background: var(--cyan-neon);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan-neon);
      animation: blink 1s infinite alternate;
    }

    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 30%, #ff8095 70%, #ff003c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 5px 15px rgba(0,0,0,0.8);
      line-height: 1.1;
    }

    /* Display de Usuario */
    .hero-box {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(10px);
      transform: translateZ(25px);
      margin-bottom: 15px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .skull-avatar {
      width: 75px; height: 75px;
      background: radial-gradient(circle, #082028 0%, #020508 80%);
      border-radius: 12px;
      border: 1px solid var(--cyan-neon);
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      position: relative;
    }

    .skull-avatar svg {
      width: 50px; height: 50px;
      filter: drop-shadow(0 0 8px var(--cyan-neon));
    }

    .user-details .label {
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .user-details .name {
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .user-details .code {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: #ff8095;
      margin-top: 2px;
    }

    /* Código QR con Escáner */
    .qr-container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px;
      transform: translateZ(20px);
      margin-bottom: 15px;
    }

    .qr-wrapper {
      width: 80px; height: 80px;
      background: #fff;
      border-radius: 10px;
      padding: 5px;
      position: relative;
      overflow: hidden;
    }

    .qr-wrapper img { width: 100%; height: 100%; display: block; }

    .scanner-line {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 3px;
      background: var(--cyan-neon);
      box-shadow: 0 0 10px var(--cyan-neon);
      animation: scan 2s ease-in-out infinite alternate;
    }

    @keyframes scan { 0% { top: 0%; } 100% { top: 95%; } }

    .status-box .status-title {
      color: #00ffaa;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .status-box .status-sub {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.2;
    }

    /* Grilla VIP Dorada */
    .vip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      transform: translateZ(35px);
      margin-bottom: 15px;
    }

    .vip-card {
      background: linear-gradient(135deg, rgba(30,20,5,0.8), rgba(5,5,5,0.9));
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: inset 0 1px 1px var(--gold-light), 0 4px 10px rgba(0,0,0,0.6);
    }

    .vip-card .tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .vip-card .val {
      font-size: 1rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Footer */
    footer {
      text-align: center;
      transform: translateZ(15px);
      border-top: 1px dashed rgba(255,255,255,0.2);
      padding-top: 10px;
    }

    .footer-time {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .footer-notice {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Partículas de fondo -->
  <canvas id="particles-canvas"></canvas>

  <div class="scene">
    <div class="ticket-card" id="card">
      <div class="inner-card">
        <div class="hologram" id="holo"></div>

        <!-- Encabezado -->
        <div class="header">
          <div class="badge-verified">
            <span class="pulse"></span> Official Pass
          </div>
          <h1 class="title">The Sinister<br>Forest</h1>
        </div>

        <!-- Titular & Código -->
        <div class="hero-box">
          <div class="skull-avatar">
            <svg viewBox="0 0 100 100" fill="none">
              <path d="M50 12 C28 12 16 28 16 48 C16 60 22 70 30 76 L30 88 L70 88 L70 76 C78 70 84 60 84 48 C84 28 72 12 50 12 Z" fill="#0b171c" stroke="#00f0ff" stroke-width="2"/>
              <circle cx="36" cy="48" r="9" fill="#00f0ff" fill-opacity="0.3" stroke="#00f0ff" stroke-width="2"/>
              <circle cx="64" cy="48" r="9" fill="#00f0ff" fill-opacity="0.3" stroke="#00f0ff" stroke-width="2"/>
              <path d="M50 58 L45 66 L55 66 Z" fill="#00f0ff"/>
              <path d="M38 78 L38 88 M46 78 L46 88 M54 78 L54 88 M62 78 L62 88" stroke="#00f0ff" stroke-width="2"/>
            </svg>
          </div>
          <div class="user-details">
            <div class="label">Titular del Pase</div>
            <div class="name" id="display-name">GUEST</div>
            <div class="label" style="margin-top: 6px;">Código de Verificación</div>
            <div class="code" id="display-code">TSF-000000</div>
          </div>
        </div>

        <!-- QR Dinámico con Láser -->
        <div class="qr-container">
          <div class="qr-wrapper">
            <div class="scanner-line"></div>
            <img id="qr-img" src="" alt="QR Access" />
          </div>
          <div class="status-box">
            <div class="status-title">✓ Acceso Autenticado</div>
            <div class="status-sub">Criptográficamente firmado. Presentar DNI en la entrada.</div>
          </div>
        </div>

        <!-- Paneles VIP Dorados -->
        <div class="vip-grid">
          <div class="vip-card">
            <div class="tag">Zona VIP</div>
            <div class="val">El Abismo</div>
          </div>
          <div class="vip-card">
            <div class="tag">Mesa Reservada</div>
            <div class="val">Z-13</div>
          </div>
        </div>

        <!-- Footer -->
        <footer>
          <div class="footer-time">11 AGO // 23:00H | RAW TECHNO</div>
          <div class="footer-notice">Acceso personal e intransferible</div>
        </footer>

      </div>
    </div>
  </div>

  <script>
    // 1. Parámetros URL
    const urlParams = new URLSearchParams(window.location.search);
    const name = (urlParams.get('name') || "GUEST").toUpperCase();
    const code = (urlParams.get('code') || "TSF-000000").toUpperCase();

    document.getElementById("display-name").innerText = decodeURIComponent(name);
    document.getElementById("display-code").innerText = decodeURIComponent(code);
    document.getElementById("qr-img").src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=TSF-VIP:${code}:${name}&color=050508`;

    // 2. Efecto Tilt 3D + Holograma
    const card = document.getElementById('card');
    const holo = document.getElementById('holo');

    document.addEventListener('mousemove', (e) => {
      const { clientX, clientY } = e;
      const { innerWidth, innerHeight } = window;
      
      const rotX = ((clientY / innerHeight) - 0.5) * -35;
      const rotY = ((clientX / innerWidth) - 0.5) * 35;

      card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      holo.style.transform = `translateY(${rotX * 2}px) rotate(20deg)`;
    });

    // 3. Sistema de Partículas Canvas
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 10;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.color = Math.random() > 0.3 ? '#ff003c' : '#00f0ff';
      }
      update() {
        this.y -= this.speedY;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 60; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
