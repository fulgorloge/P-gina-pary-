<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Pass // The Sinister Forest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=UnifrakturMaguntina&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050203;
      --gold-light: #fff3a8;
      --gold-mid: #d4af37;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --font-techno: 'Orbitron', sans-serif;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, #4a000e 0%, #0a0305 70%),
        radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 60, 0.15) 0%, transparent 40%);
      font-family: var(--font-ui);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    #particles-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .instructions {
      position: relative;
      z-index: 10;
      font-family: var(--font-techno);
      font-size: 0.65rem;
      color: var(--gold-light);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
      animation: pulseText 1.5s infinite alternate ease-in-out;
    }

    @keyframes pulseText {
      from { opacity: 0.5; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    /* Contenedor Adaptable */
    .ticket-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      perspective: 1200px;
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.25)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
    }

    .ticket-frame {
      padding: 2px;
      background: var(--gold-gradient);
      border-radius: 16px;
      position: relative;
      transition: background 0.5s ease;
    }

    .ticket {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #120004 0%, #2a000a 50%, #0d0003 100%);
      border-radius: 14px;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.95);
      transform-style: preserve-3d;
    }

    .ticket::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255, 0, 60, 0.2) 1px, transparent 0);
      background-size: 10px 10px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* Destellos de Esquina */
    .star-flare {
      position: absolute;
      width: 22px; height: 22px;
      background: radial-gradient(circle, #ffffff 15%, rgba(255, 243, 168, 0.9) 35%, transparent 70%);
      clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
      z-index: 20;
      pointer-events: none;
      animation: flarePulse 2s infinite alternate ease-in-out;
    }

    .flare-1 { top: -8px; left: -8px; }
    .flare-2 { top: -8px; right: -8px; }
    .flare-3 { bottom: -8px; left: -8px; }
    .flare-4 { bottom: -8px; right: -8px; }

    @keyframes flarePulse {
      0% { transform: scale(0.5); opacity: 0.3; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .notch {
      position: absolute;
      width: 22px; height: 22px;
      background-color: var(--bg-dark);
      border-radius: 50%;
      z-index: 10;
      border: 2px solid #d4af37;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.9);
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .notch-left { left: -11px; bottom: 120px; }
    .notch-right { right: -11px; bottom: 120px; }

    /* LÍNEA INTERACTIVA DE CORTE CON EFECTO NEÓN */
    .stub-border-interactive {
      position: absolute;
      left: 14px; right: 14px; bottom: 131px;
      height: 24px;
      transform: translateY(50%);
      z-index: 30;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .stub-border-line {
      width: 100%;
      height: 2px;
      border-top: 2px dashed rgba(212, 175, 55, 0.8);
      position: relative;
      transition: border-color 0.3s;
    }

    .cut-progress {
      position: absolute;
      left: 0; top: -2px;
      height: 5px;
      background: linear-gradient(90deg, #ff003c 0%, #ff8000 50%, #fff3a8 100%);
      box-shadow: 0 0 12px #ff003c, 0 0 20px #ff8000;
      width: 0%;
      border-radius: 4px;
      transition: width 0.03s ease-out;
    }

    /* Puntero de la navaja táctil */
    .blade-indicator {
      position: absolute;
      width: 16px; height: 16px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #ff003c, 0 0 25px #ffffff;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 40;
      transition: transform 0.15s ease-out;
    }

    .stub-border-interactive:active .blade-indicator,
    .stub-border-interactive.cutting .blade-indicator {
      transform: translate(-50%, -50%) scale(1);
    }

    /* SECCIONES Y FÍSICA DE RASGADO */
    .main-section {
      padding: 24px 18px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease, filter 0.8s ease;
      transform-origin: top center;
    }

    .stub-section {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      text-align: center;
      position: relative;
      transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease, filter 0.9s ease;
      transform-origin: bottom center;
    }

    /* Animación de Torsión durante el arrastre */
    .ticket.bending .main-section {
      transform: rotateX(8deg) translateY(-3px);
    }

    .ticket.bending .stub-section {
      transform: rotateX(-12deg) translateY(5px);
    }

    /* Animación de CORTE COMPLETADO (Cae el talón) */
    .ticket.torn .main-section {
      transform: translateY(-25px) translateZ(20px) rotate(-2.5deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
    }

    .ticket.torn .stub-section {
      transform: translateY(180px) rotate(18deg) translateZ(-50px);
      opacity: 0;
      filter: blur(4px);
      pointer-events: none;
    }

    /* Borde dentado irregular de desgarro */
    .ticket.torn .main-section::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 0; right: 0;
      height: 6px;
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 4px, #120004 4px, #120004 8px);
      z-index: 20;
    }

    .ticket.torn .stub-border-interactive,
    .ticket.torn .notch {
      opacity: 0;
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #d4af37;
      padding: 3px 10px;
      border-radius: 4px;
      font-family: var(--font-techno);
      font-size: 0.5rem;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.75);
      margin-bottom: 12px;
    }

    .badge-icon {
      width: 6px; height: 6px;
      background: #ff003c;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff003c;
    }

    .main-header {
      font-family: var(--font-techno);
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .event-title {
      font-family: 'UnifrakturMaguntina', cursive;
      font-size: 2.3rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 0, 60, 0.9), 0 0 20px rgba(255, 0, 60, 0.5);
      line-height: 1;
      margin: 4px 0;
    }

    .sub-header {
      font-family: var(--font-techno);
      font-size: 0.62rem;
      letter-spacing: 3px;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .date-info {
      font-family: var(--font-techno);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
      margin-bottom: 16px;
      border-top: 1px solid rgba(212, 175, 55, 0.5);
      border-bottom: 1px solid rgba(212, 175, 55, 0.5);
      padding: 6px 14px;
      background: rgba(212, 175, 55, 0.08);
      width: 100%;
    }

    .meta-grid {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .meta-box {
      flex: 1;
      max-width: 170px;
      border: 1px solid rgba(212, 175, 55, 0.6);
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
    }

    .meta-label {
      font-family: var(--font-techno);
      font-size: 0.45rem;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .meta-value {
      font-family: var(--font-techno);
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .stub-vertical-text {
      font-family: var(--font-techno);
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .stub-footer {
      font-family: var(--font-techno);
      font-size: 0.52rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 1.2px;
    }

    /* ESCRITORIO */
    @media (min-width: 580px) {
      .stub-border-interactive {
        left: auto; right: 145px; top: 14px; bottom: 14px;
        width: 24px; height: auto;
        transform: translateX(50%);
        cursor: ew-resize;
      }

      .stub-border-line {
        width: 2px; height: 100%;
        border-top: none;
        border-left: 2px dashed rgba(212, 175, 55, 0.8);
      }

      .cut-progress {
        width: 5px; height: 0%;
        left: -2px; top: 0;
        background: linear-gradient(180deg, #ff003c 0%, #ff8000 50%, #fff3a8 100%);
      }

      .ticket { flex-direction: row; }
      .main-section { flex: 1; padding: 20px; }
      .badge { position: absolute; top: 12px; left: 15px; margin-bottom: 0; }
      .main-header { margin-top: 10px; }
      .date-info { width: auto; }

      .stub-section {
        width: 155px;
        padding: 20px 10px;
        justify-content: space-between;
        border-left: 1px solid rgba(212, 175, 55, 0.2);
      }

      .stub-vertical-text {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 0.55rem;
      }

      .notch-left, .notch-right { display: none; }
      .notch-top { display: block; right: 145px; top: -11px; }
      .notch-bottom { display: block; right: 145px; bottom: -11px; }

      .ticket.bending .main-section {
        transform: rotateY(-8deg) translateX(-3px);
      }

      .ticket.bending .stub-section {
        transform: rotateY(12deg) translateX(5px);
      }

      .ticket.torn .main-section {
        transform: translateX(-25px) translateZ(20px) rotate(-2.5deg);
      }

      .ticket.torn .stub-section {
        transform: translateX(180px) rotate(22deg) translateZ(-50px);
      }

      .ticket.torn .main-section::after {
        top: 0; bottom: 0; right: -6px; left: auto;
        width: 6px; height: auto;
        background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, #120004 4px, #120004 8px);
      }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <div class="instructions" id="instruction-text">✂️ DESLIZA SOBRE LA LÍNEA PARA CORTAR EL TIQUETE ✂️</div>

  <div class="ticket-wrapper">
    <div class="star-flare flare-1"></div>
    <div class="star-flare flare-2"></div>
    <div class="star-flare flare-3"></div>
    <div class="star-flare flare-4"></div>

    <div class="ticket-frame" id="ticket-frame">
      <div class="notch notch-left notch-top"></div>
      <div class="notch notch-right notch-bottom"></div>

      <!-- Línea táctil de recorte -->
      <div class="stub-border-interactive" id="cut-line">
        <div class="blade-indicator" id="blade-indicator"></div>
        <div class="stub-border-line">
          <div class="cut-progress" id="cut-progress"></div>
        </div>
      </div>

      <div class="ticket" id="ticket">
        <!-- Sección Principal -->
        <div class="main-section">
          <div class="badge">
            <span class="badge-icon"></span> Official Pass
          </div>

          <div class="main-header">VIP Pass</div>
          <div class="event-title">The Sinister Forest</div>
          <div class="sub-header">Event Of The Year</div>

          <div class="date-info">
            11 AGO // 23:00H | RAW TECHNO
          </div>

          <div class="meta-grid">
            <div class="meta-box">
              <div class="meta-label">Pass Holder</div>
              <div class="meta-value" id="display-name">JP</div>
            </div>
            <div class="meta-box">
              <div class="meta-label">Ticket Code</div>
              <div class="meta-value" id="display-code">TSF-448791</div>
            </div>
          </div>
        </div>

        <!-- Talón Inferior -->
        <div class="stub-section">
          <div class="stub-vertical-text">EVENT OF THE YEAR — 11 AGO</div>
          <div class="stub-footer">ADMIT ONE // DNI REQUIRED</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawName = urlParams.get('name') || "JP";
    const rawCode = urlParams.get('code') || "TSF-448791";

    document.getElementById("display-name").innerText = decodeURIComponent(rawName).toUpperCase();
    document.getElementById("display-code").innerText = decodeURIComponent(rawCode).toUpperCase();

    // INTERACCIÓN DE CORTE AVANZADA
    const cutLine = document.getElementById('cut-line');
    const cutProgress = document.getElementById('cut-progress');
    const bladeIndicator = document.getElementById('blade-indicator');
    const ticket = document.getElementById('ticket');
    const ticketFrame = document.getElementById('ticket-frame');
    const instructionText = document.getElementById('instruction-text');

    let isCutting = false;
    let isTorn = false;
    let lastProgress = 0;

    // AUDIO CON SÍNTESIS DE CRU
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playRipSound(pitch = 1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const bufferSize = audioCtx.sampleRate * 0.05; // micro-sonido continuo
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      }
      
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200 * pitch + (Math.random() * 400 - 200);
      filter.Q.value = 3;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playFinalTearSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const bufferSize = audioCtx.sampleRate * 0.4;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
      }
      
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2500, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.4);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function handleStart(e) {
      if (isTorn) return;
      isCutting = true;
      ticket.classList.add('bending');
      cutLine.classList.add('cutting');
      updateCut(e);
    }

    function handleMove(e) {
      if (!isCutting || isTorn) return;
      updateCut(e);
    }

    function handleEnd() {
      if (isTorn) return;
      isCutting = false;
      ticket.classList.remove('bending');
      cutLine.classList.remove('cutting');
      cutProgress.style.width = '0%';
      cutProgress.style.height = '0%';
      lastProgress = 0;
    }

    function updateCut(e) {
      const rect = cutLine.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const isHorizontal = window.innerWidth >= 580;

      let pct = 0;
      if (isHorizontal) {
        pct = (clientY - rect.top) / rect.height;
        bladeIndicator.style.left = '50%';
        bladeIndicator.style.top = (pct * 100) + '%';
      } else {
        pct = (clientX - rect.left) / rect.width;
        bladeIndicator.style.top = '50%';
        bladeIndicator.style.left = (pct * 100) + '%';
      }

      pct = Math.max(0, Math.min(1, pct));

      if (isHorizontal) {
        cutProgress.style.height = (pct * 100) + '%';
      } else {
        cutProgress.style.width = (pct * 100) + '%';
      }

      // Generar sonidos y vibración progresivos al avanzar
      if (Math.abs(pct - lastProgress) > 0.04) {
        playRipSound(0.8 + pct * 0.6);
        if (navigator.vibrate) navigator.vibrate(12);
        createSpark(clientX, clientY);
        lastProgress = pct;
      }

      // CORTE COMPLETADO AL LLEGAR AL 88%
      if (pct >= 0.88) {
        isTorn = true;
        isCutting = false;
        ticket.classList.remove('bending');
        ticket.classList.add('torn');
        cutLine.classList.remove('cutting');

        instructionText.innerText = "✓ ACCESO VALIDADO // TICKET CORTADO";
        instructionText.style.color = "#00ffaa";
        instructionText.style.animation = "none";

        playFinalTearSound();
        if (navigator.vibrate) navigator.vibrate([30, 50, 80]);
        createBurstSparks(clientX, clientY);
      }
    }

    // EFECTOS VISUALES DE CHISPAS
    function createSpark(x, y) {
      const spark = document.createElement('div');
      spark.style.position = 'fixed';
      spark.style.left = x + 'px';
      spark.style.top = y + 'px';
      spark.style.width = (Math.random() * 4 + 2) + 'px';
      spark.style.height = spark.style.width;
      spark.style.background = '#fff3a8';
      spark.style.borderRadius = '50%';
      spark.style.boxShadow = '0 0 10px #ff003c, 0 0 18px #ff8000';
      spark.style.pointerEvents = 'none';
      spark.style.zIndex = '100';
      
      const vx = (Math.random() - 0.5) * 40;
      const vy = (Math.random() - 0.5) * 40;
      
      document.body.appendChild(spark);

      spark.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${vx}px, ${vy}px) scale(0)`, opacity: 0 }
      ], {
        duration: 350,
        easing: 'cubic-bezier(0, .9, .57, 1)'
      }).onfinish = () => spark.remove();
    }

    function createBurstSparks(x, y) {
      for (let i = 0; i < 20; i++) {
        setTimeout(() => createSpark(x, y), i * 12);
      }
    }

    cutLine.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    cutLine.addEventListener('touchstart', handleStart, { passive: true });
    window.addEventListener('touchmove', handleMove, { passive: true });
    window.addEventListener('touchend', handleEnd);

    // CANVAS DE PARTÍCULAS
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = Array.from({ length: 25 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.3 + 0.1,
      decay: Math.random() * 0.01 + 0.005
    }));

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.y -= p.speed;
        p.alpha += p.decay;

        if (p.alpha > 1 || p.alpha < 0) p.decay = -p.decay;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 243, 168, ${Math.max(0, p.alpha)})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#d4af37';
        ctx.fill();
      });

      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
